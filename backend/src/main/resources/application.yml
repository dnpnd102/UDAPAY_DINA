# =============================================================================
# application.yml — runtime configuration for the Udapay Ledger Service.
#
# NOTE: there is deliberately NO spring.datasource.password here. It is
# supplied by HashiCorp Vault (kv/udapay-ledger/<profile>) via bootstrap.yml.
# =============================================================================
spring:
  application:
    name: udapay-ledger
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/udapay}
    username: ${SPRING_DATASOURCE_USERNAME:udapay}
    # password: <- intentionally absent; resolved from Vault at startup
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm that signs the access tokens we accept.
          # issuer-uri must match the `iss` claim exactly (what the client sees),
          # jwk-set-uri is how THIS container reaches Keycloak to fetch keys.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/udapay}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9000/realms/udapay/protocol/openid-connect/certs}

server:
  port: 8080
  forward-headers-strategy: framework   # behind Nginx
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # health + prometheus are public (see SecurityConfig); env/info require a token
        include: health,prometheus,info,env
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    env:
      show-values: never          # keys only — never leak secret values
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.udapay.ledger: INFO
    org.springframework.security: WARN
