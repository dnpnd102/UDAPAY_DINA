# =============================================================================
# Nginx reverse proxy for the Udapay stack
#   /api/*, /actuator/*  -> ledger-api:8080  (Spring Boot)
#   /realms/*, /resources/*, /admin/*, /js/* -> keycloak:9000
# TLS terminates here in production (443); the API itself speaks plain HTTP
# on the private compose network and still emits HSTS/CSP headers.
# =============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format json_combined escape=json
      '{"@timestamp":"$time_iso8601","client.ip":"$remote_addr",'
      '"http.request.method":"$request_method","url.path":"$request_uri",'
      '"http.response.status_code":$status,"http.response.body.bytes":$body_bytes_sent,'
      '"event.duration_ms":$request_time,"upstream":"$upstream_addr",'
      '"traceparent":"$http_traceparent"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 1m;

    # Basic rate limiting for the API
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream ledger_api {
        server ledger-api:8080;
        keepalive 16;
    }

    upstream keycloak {
        server keycloak:9000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --- Ledger API -------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass         http://ledger_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            # Forward W3C trace context untouched so the API can log it
            proxy_set_header   traceparent       $http_traceparent;
            proxy_set_header   tracestate        $http_tracestate;
            proxy_read_timeout 30s;
        }

        # Only the public actuator endpoints are exposed through the proxy
        location = /actuator/health {
            proxy_pass         http://ledger_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /actuator/prometheus {
            proxy_pass         http://ledger_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /actuator/ {
            return 404;
        }

        # --- Keycloak ---------------------------------------------------------
        location ~ ^/(realms|resources|admin|js)/ {
            proxy_pass         http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        location / {
            return 404;
        }
    }

    # --- TLS (production) -------------------------------------------------------
    # Mount a certificate/key pair into the container and uncomment:
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name api.udapay.example;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     include /etc/nginx/conf.d/udapay-locations.conf;
    # }
}
